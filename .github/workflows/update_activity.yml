name: Daily Profile SVG Update

on:
  schedule:
    - cron: '0 0 * * *' # daily, 05:30 IST
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'dark_mode.svg'
      - 'light_mode.svg'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh uptime + GitHub stats
        run: python3 today.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: Harsha-code-per

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || (git commit -m "Update profile stats" && git push)
